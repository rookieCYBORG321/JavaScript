<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 2 - ES6 Features & Billing Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-wrapper">
    <!-- Student Profile Header -->
    <header class="profile-header-card">
        <div class="profile-detail">
            <span class="detail-label">STUDENT NAME:</span>
            <span class="detail-value">Parth Jani</span>
        </div>
        <div class="profile-detail">
            <span class="detail-label">STUDENT PRN:</span>
            <span class="detail-value">24070521241</span>
        </div>
    </header>

    <main class="grid-container">
        <!-- Input Form Card -->
        <section class="glass-card">
            <h2 class="card-title">Add Billing Item</h2>
            <form id="billingForm">
                <div class="input-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" placeholder="e.g. Mechanical Keyboard" required>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="itemPrice">Price (₹)</label>
                        <input type="number" id="itemPrice" min="0.01" step="0.01" placeholder="3500" required>
                    </div>

                    <div class="input-group">
                        <label for="itemQty">Quantity</label>
                        <input type="number" id="itemQty" min="1" value="1" required>
                    </div>
                </div>

                <button type="submit" class="accent-btn">Add to Invoice</button>
            </form>
        </section>

        <!-- Billing Summary & Breakdown -->
        <section class="glass-card">
            <h2 class="card-title">Live Calculations</h2>
            <div id="summaryDisplay" class="summary-box">
                <p class="empty-notice">No items added to invoice yet.</p>
            </div>
        </section>

        <!-- Itemized Cart Table -->
        <section class="glass-card full-width">
            <div class="table-header">
                <h2 class="card-title">Itemized Invoice Items</h2>
                <button id="clearAllBtn" class="clear-btn">Clear All</button>
            </div>

            <div class="table-wrapper">
                <table class="custom-table">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Item Name</th>
                        <th>Unit Price</th>
                        <th>Qty</th>
                        <th>Subtotal</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="cartItemsBody">
                    <!-- Items rendered dynamically -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
